MODEL:
  ADAPTATION: petal
  ARCH: resnet50
TEST:
  BATCH_SIZE: 64
CORRUPTION:
  DATASET: imagenet_c
  SEVERITY:
    - 5
  TYPE:
    - gaussian_noise
    - shot_noise
    - impulse_noise
    - defocus_blur
    - glass_blur
    - motion_blur
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression
OPTIM:
  METHOD: SGD
  STEPS: 1
  BETA: 0.9
  LR: 0.01
  WD: 0.
M_TEACHER:
  MOMENTUM: 0.999
PETAL:
  PERC: 0.003
  RST: 1.0
  SPW: 1e-11
  AP: 0.1