MODEL:
  ADAPTATION: petta
  ARCH: Standard
TEST:
  BATCH_SIZE: 64
CORRUPTION:
  DATASET: cifar10_c
  SEVERITY:
    - 5
  TYPE:
    - gaussian_noise
    - shot_noise
    - impulse_noise
    - defocus_blur
    - glass_blur
    - motion_blur
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression
OPTIM:
  METHOD: Adam
  STEPS: 1
  BETA: 0.9
  LR: 1e-3
  WD: 0.
ROTTA:
  MEMORY_SIZE: 64
  UPDATE_FREQUENCY: 64
PETTA:
  ALPHA_0: 0.001
  LAMBDA_0: 10.0
  AL_WGT: 1.0
  REGULARIZER: cosine
  ADAPTIVE_LAMBDA: True
  ADAPTIVE_ALPHA: True
  NORM_LAYER: rbn
  LOSS_FUNC: sce
  PERCENTAGE: 1.0
  NUM_WORKERS: 4
